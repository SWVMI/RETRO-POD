name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Web App Dependencies
        working-directory: retro-player
        run: npm ci

      - name: Install CI TypeScript Dependencies
        working-directory: retro-player
        run: npm install --no-save --save-dev @types/jsdom

      - name: Configure TypeScript for CI
        working-directory: retro-player
        run: |
          node <<'EOF'
          const fs = require('fs');

          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          config.compilerOptions = {
            ...(config.compilerOptions || {}),
            target: 'ES2018'
          };

          fs.writeFileSync(
            path,
            JSON.stringify(config, null, 2) + '\n'
          );

          console.log('TypeScript target set to ES2018');
          EOF

          echo "Updated tsconfig.json:"
          cat tsconfig.json

      - name: Fix JSDOM TypeScript Definition for CI
        working-directory: retro-player
        run: |
          echo "Searching for JSDOM ConstructorOptions declaration..."

          JSDOM_FILE=$(grep -RIl "interface ConstructorOptions" node_modules/@types node_modules/jsdom 2>/dev/null | head -n 1 || true)

          if [ -z "$JSDOM_FILE" ]; then
            echo "Could not locate ConstructorOptions declaration."
            echo "Installed JSDOM packages:"
            npm ls jsdom @types/jsdom || true
            exit 1
          fi

          echo "Found declaration at: $JSDOM_FILE"

          if grep -q "userAgent" "$JSDOM_FILE"; then
            echo "userAgent declaration already exists."
          else
            python3 - "$JSDOM_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          marker = "interface ConstructorOptions {"

          if marker not in content:
              print("ConstructorOptions interface not found.")
              sys.exit(1)

          content = content.replace(
              marker,
              marker + "\n    userAgent?: string;",
              1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Added userAgent to ConstructorOptions for CI.")
          PY
          fi

      - name: Build Next.js Web App
        working-directory: retro-player
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli@latest sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk