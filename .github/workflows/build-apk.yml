name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Web App Dependencies
        working-directory: retro-player
        run: npm install

      - name: Install CI TypeScript Dependencies
        working-directory: retro-player
        run: npm install --no-save --save-dev @types/jsdom

      - name: Configure TypeScript for CI
        working-directory: retro-player
        run: |
          node -e "const fs=require('fs'); const p='tsconfig.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.compilerOptions={...(c.compilerOptions||{}), target:'ES2018'}; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"

      - name: Build Next.js Web App
        working-directory: retro-player
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli@latest sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk