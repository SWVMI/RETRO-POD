name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Web App Dependencies
        working-directory: retro-player
        run: npm ci

      - name: Install CI TypeScript Dependencies
        working-directory: retro-player
        run: npm install --no-save --save-dev @types/jsdom

      - name: Configure TypeScript for CI
        working-directory: retro-player
        run: |
          node <<'EOF'
          const fs = require('fs');

          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          config.compilerOptions = {
            ...(config.compilerOptions || {}),
            target: 'ES2018'
          };

          fs.writeFileSync(
            path,
            JSON.stringify(config, null, 2) + '\n'
          );

          console.log('TypeScript target set to ES2018');
          EOF

          echo "Updated tsconfig.json:"
          cat tsconfig.json

      - name: Fix JSDOM TypeScript Definition for CI
        working-directory: retro-player
        run: |
          node <<'EOF'
          const fs = require('fs');

          const path = 'node_modules/@types/jsdom/base.d.ts';

          if (!fs.existsSync(path)) {
            console.log('@types/jsdom declaration file not found');
            process.exit(0);
          }

          let content = fs.readFileSync(path, 'utf8');

          if (!content.includes('userAgent?: string')) {
            content = content.replace(
              /interface ConstructorOptions \{/,
              'interface ConstructorOptions {\n    userAgent?: string;'
            );

            fs.writeFileSync(path, content);
            console.log('Added userAgent to JSDOM ConstructorOptions for CI');
          } else {
            console.log('userAgent already exists in JSDOM declarations');
          }
          EOF

      - name: Build Next.js Web App
        working-directory: retro-player
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli@latest sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk