<!DOCTYPE html>
<html>
<head>
    <title>RetroPod Spotify Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: height: 100vh; margin: 0; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <h3 id="status">Connecting to RetroPod...</h3>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const error = params.get("error");

        if (code) {
            window.location.href = "retropod://callback?code=" + code;
        } else if (error) {
            document.getElementById("status").innerText = "Spotify Authentication Error: " + error;
        } else {
            document.getElementById("status").innerText = "No authorization code received from Spotify.";
        }
    </script>
</body>
</html>
